<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | GlobalEarn</title>


    <!-- Google Font -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >


    <!-- Login CSS -->

    <link
        rel="stylesheet"
        href="login.css"
    >

</head>


<body>


    <!-- =========================================
         HEADER
    ========================================== -->

    <header class="auth-header">

        <a
            href="index.html"
            class="auth-logo"
        >

            <i class="fa-solid fa-globe"></i>

            <div>

                <strong>
                    GlobalEarn
                </strong>

                <span>
                    Earn • Grow • Succeed
                </span>

            </div>

        </a>


        <a
            href="register.html"
            class="back-register"
        >

            Don't have an account?

            <strong>
                Register
            </strong>

        </a>

    </header>



    <!-- =========================================
         LOGIN PAGE
    ========================================== -->

    <main class="login-page">

        <div class="login-container">

            <div class="login-card">


                <!-- =================================
                     TITLE
                ================================== -->

                <div class="login-title">

                    <div class="login-icon">

                        <i class="fa-solid fa-right-to-bracket"></i>

                    </div>


                    <h1>
                        Welcome Back
                    </h1>


                    <p>
                        Login to your GlobalEarn account.
                    </p>

                </div>



                <!-- =================================
                     MESSAGE
                ================================== -->

                <div
                    id="message"
                    class="message"
                    role="alert"
                ></div>



                <!-- =================================
                     LOGIN FORM
                ================================== -->

                <form
                    id="loginForm"
                    novalidate
                >


                    <!-- EMAIL -->

                    <div class="input-group">

                        <label for="email">
                            Gmail / Email
                        </label>


                        <div class="input-box">

                            <i class="fa-solid fa-envelope"></i>


                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Enter your email"
                                autocomplete="email"
                                required
                            >

                        </div>

                    </div>



                    <!-- PASSWORD -->

                    <div class="input-group">

                        <div class="password-label">

                            <label for="password">
                                Password
                            </label>


                            <a href="#">
                                Forgot Password?
                            </a>

                        </div>


                        <div class="input-box">

                            <i class="fa-solid fa-lock"></i>


                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                            >


                            <button
                                type="button"
                                class="password-toggle"
                                data-target="password"
                                aria-label="Show password"
                            >

                                <i class="fa-solid fa-eye"></i>

                            </button>

                        </div>

                    </div>



                    <!-- REMEMBER ME -->

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        <span>
                            Remember me
                        </span>

                    </label>



                    <!-- LOGIN BUTTON -->

                    <button
                        type="submit"
                        id="loginButton"
                        class="login-submit"
                    >

                        <span id="buttonText">
                            Login
                        </span>


                        <span
                            id="buttonLoader"
                            class="button-loader"
                        >

                            <i class="fa-solid fa-spinner fa-spin"></i>

                        </span>

                    </button>


                </form>



                <!-- =================================
                     REGISTER LINK
                ================================== -->

                <div class="register-link">

                    Don't have an account?

                    <a href="register.html">
                        Create Account
                    </a>

                </div>


            </div>

        </div>

    </main>



    <!-- =========================================
         FOOTER
    ========================================== -->

    <footer class="auth-footer">

        <p>
            © 2026 GlobalEarn. All Rights Reserved.
        </p>

    </footer>



    <!-- =========================================
         LOGIN JAVASCRIPT
    ========================================== -->

    <script
        type="module"
        src="login.js"
    ></script>


</body>

</html>
