<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Create Account | GlobalEarn</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link rel="stylesheet"
href="css/register.css">

</head>

<body>

<div class="container">

<div class="register-box">

<div class="logo">

<i class="fa-solid fa-globe"></i>

<h2>GlobalEarn</h2>

</div>

<h1>Create Your Account</h1>

<p>

Join GlobalEarn today and receive your
<strong>$50 Welcome Bonus</strong>.

</p>

<form id="registerForm">

<div class="input-box">

<label>Full Name</label>

<input
type="text"
id="fullname"
placeholder="Enter your full name"
required>

</div>

<div class="input-box">

<label>Username</label>

<input
type="text"
id="username"
placeholder="@username"
required>

</div>

<div class="input-box">

<label>Country</label>

<select
id="country"
required>

<option value="">Select Country</option>

<option>Nigeria</option>
<option>Ghana</option>
<option>South Africa</option>
<option>Kenya</option>
<option>United States</option>
<option>Canada</option>
<option>United Kingdom</option>
<option>Germany</option>
<option>France</option>
<option>Italy</option>
<option>Spain</option>
<option>Australia</option>
<option>Brazil</option>
<option>India</option>
<option>China</option>
<option>Japan</option>

</select>

</div>

<div class="input-box">

<label>Referral Username (Optional)</label>

<input
type="text"
id="referral"
placeholder="@username">

</div>

<div class="input-box">

<label>Gmail Address</label>

<input
type="email"
id="email"
placeholder="example@gmail.com"
required>

</div>

<div class="input-box">

<label>Phone Number</label>

<input
type="tel"
id="phone"
placeholder="+234..."
required>

</div>

<div class="input-box">

<label>Password</label>

<input
type="password"
id="password"
placeholder="Password"
required>

</div>

<div class="input-box">

<label>Confirm Password</label>

<input
type="password"
id="confirmPassword"
placeholder="Confirm Password"
required>

</div>

<button
type="submit"
class="register-btn">

Create Account

</button>

</form>

<div class="bottom-text">

Already have an account?

<a href="login.html">

Login

</a>

</div>

</div>

</div>

<script type="module"
src="js/register.js"></script>

</body>

</html>
