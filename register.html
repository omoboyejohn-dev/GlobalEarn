<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | GlobalEarn</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <link rel="stylesheet" href="register.css">

</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="auth-header">

        <a href="index.html" class="auth-logo">

            <i class="fa-solid fa-globe"></i>

            <div>
                <strong>GlobalEarn</strong>
                <span>Earn • Grow • Succeed</span>
            </div>

        </a>

        <a href="login.html" class="back-login">
            Already have an account? <strong>Login</strong>
        </a>

    </header>


    <!-- ================= REGISTER ================= -->

    <main class="register-page">

        <div class="register-container">

            <div class="register-card">

                <div class="register-title">

                    <div class="register-icon">
                        <i class="fa-solid fa-user-plus"></i>
                    </div>

                    <h1>Create Your Account</h1>

                    <p>
                        Join GlobalEarn and start your earning journey.
                    </p>

                </div>


                <!-- MESSAGE -->

                <div id="message" class="message"></div>


                <!-- FORM -->

                <form id="registerForm">

                    <!-- FULL NAME -->

                    <div class="input-group">

                        <label for="fullName">
                            Full Name
                        </label>

                        <div class="input-box">

                            <i class="fa-solid fa-user"></i>

                            <input
                                type="text"
                                id="fullName"
                                placeholder="Enter your full name"
                                required
                            >

                        </div>

                    </div>


                    <!-- USERNAME -->

                    <div class="input-group">

                        <label for="username">
                            Username
                        </label>

                        <div class="input-box">

                            <i class="fa-solid fa-at"></i>

                            <input
                                type="text"
                                id="username"
                                placeholder="Choose a username"
                                required
                            >

                        </div>

                    </div>


                    <!-- COUNTRY -->

                    <div class="input-group">

                        <label for="country">
                            Country
                        </label>

                        <div class="input-box">

                            <i class="fa-solid fa-earth-americas"></i>

                            <select id="country" required>

                                <option value="">
                                    Select your country
                                </option>

                                <option value="Nigeria">
                                    Nigeria
                                </option>

                                <option value="Ghana">
                                    Ghana
                                </option>

                                <option value="United States">
                                    United States
                                </option>

                                <option value="United Kingdom">
                                    United Kingdom
                                </option>

                                <option value="Canada">
                                    Canada
                                </option>

                                <option value="South Africa">
                                    South Africa
                                </option>

                                <option value="Kenya">
                                    Kenya
                                </option>

                                <option value="Other">
                                    Other
                                </option>

                            </select>

                        </div>

                    </div>


                    <!-- EMAIL -->

                    <div class="input-group">

                        <label for="email">
                            Gmail / Email
                        </label>

                        <div class="input-box">

                            <i class="fa-solid fa-envelope"></i>

                            <input
                                type="email"
                                id="email"
                                placeholder="Enter your email"
                                required
                            >

                        </div>

                    </div>


                    <!-- PHONE -->

                    <div class="input-group">

                        <label for="phone">
                            Phone Number
                        </label>

                        <div class="input-box">

                            <i class="fa-solid fa-phone"></i>

                            <input
                                type="tel"
                                id="phone"
                                placeholder="Enter your phone number"
                                required
                            >

                        </div>

                    </div>


                    <!-- REFERRAL -->

                    <div class="input-group">

                        <label for="referralCode">
                            Referral Code
                            <span>(Optional)</span>
                        </label>

                        <div class="input-box">

                            <i class="fa-solid fa-users"></i>

                            <input
                                type="text"
                                id="referralCode"
                                placeholder="Enter referral code"
                            >

                        </div>

                    </div>


                    <!-- PASSWORD -->

                    <div class="input-group">

                        <label for="password">
                            Password
                        </label>

                        <div class="input-box">

                            <i class="fa-solid fa-lock"></i>

                            <input
                                type="password"
                                id="password"
                                placeholder="Create a password"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                data-target="password"
                            >
                                <i class="fa-solid fa-eye"></i>
                            </button>

                        </div>

                    </div>


                    <!-- CONFIRM PASSWORD -->

                    <div class="input-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <div class="input-box">

                            <i class="fa-solid fa-lock"></i>

                            <input
                                type="password"
                                id="confirmPassword"
                                placeholder="Confirm your password"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                data-target="confirmPassword"
                            >
                                <i class="fa-solid fa-eye"></i>
                            </button>

                        </div>

                    </div>


                    <!-- TERMS -->

                    <label class="terms">

                        <input
                            type="checkbox"
                            id="terms"
                            required
                        >

                        <span>
                            I agree to the
                            <a href="#">Terms & Conditions</a>
                            and
                            <a href="#">Privacy Policy</a>.
                        </span>

                    </label>


                    <!-- SUBMIT -->

                    <button
                        type="submit"
                        id="registerButton"
                        class="register-submit"
                    >

                        <span id="buttonText">
                            Create Account
                        </span>

                        <span id="buttonLoader" class="button-loader">
                            <i class="fa-solid fa-spinner fa-spin"></i>
                        </span>

                    </button>

                </form>


                <!-- BONUS -->

                <div class="welcome-bonus">

                    <i class="fa-solid fa-gift"></i>

                    <div>

                        <strong>$50 Welcome Bonus</strong>

                        <p>
                            New members receive a $50 account bonus.
                        </p>

                    </div>

                </div>


                <!-- LOGIN -->

                <div class="login-link">

                    Already have an account?

                    <a href="login.html">
                        Login here
                    </a>

                </div>

            </div>

        </div>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer class="auth-footer">

        <p>
            © 2026 GlobalEarn. All Rights Reserved.
        </p>

    </footer>


    <!-- ================= JAVASCRIPT ================= -->

    <script type="module" src="js/register.js"></script>

</body>

</html>
